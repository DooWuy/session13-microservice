spring:
    application:
        name: api-gateway



server:
    port: 8888

spring:
    application:
        name: gateway-service
    cloud:
        gateway:
            routes:

                - id: identity-service
                  uri: http://localhost:8080
                  predicates:
                      - Path=/identity/**
                  filters:
                      - StripPrefix=1


                - id: product-service
                  uri: http://localhost:8080
                  predicates:
                      - Path=/products/**
                  filters:
                      - StripPrefix=0

logging:
    level:
        org.springframework.cloud.gateway: DEBUG